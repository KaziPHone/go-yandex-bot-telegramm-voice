<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="80" y="80" font-family="Segoe UI, Roboto, Arial" font-size="36" fill="#0f172a">Детали проекта</text>

  <g font-family="Segoe UI, Roboto, Arial" fill="#0b1220" font-size="20">
    <text x="120" y="150">• Приём голосовых сообщений и аудиофайлов из Telegram</text>
    <text x="120" y="190">• Конвертация аудио в OGG/Opus через ffmpeg (internal/audio.ToOpus)</text>
    <text x="120" y="230">• Распознавание речи через SaluteSpeech (internal/salutesspeech.Client)</text>
    <text x="120" y="270">• Генерация краткой сводки (summary) через GigaChat (internal/gigachat.Client)</text>
    <text x="120" y="310">• Очередь задач и воркеры для обработки (internal/queue)</text>
    <text x="120" y="350">• Простое in-memory хранилище с автосохранением (internal/store.NewInMemoryStore)</text>
    <text x="120" y="390">• Postgres-реализация и миграции (migrations/, internal/store/postgres.go)</text>
    <text x="120" y="430">• Telegram-бот на gopkg.in/telebot.v3 (обработчики в internal/bot/handler.go)</text>
    <text x="120" y="470">• Команды: /start, /list, /get, /find, /chat</text>
  </g>

</svg>